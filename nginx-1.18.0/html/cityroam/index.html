<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>城市漫游 · 发现城市好去处</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/index.css" rel="stylesheet">
  <link href="./css/travel-ui.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
      .el-input__inner {
          border-radius: 20px;
      }
  </style>
</head>
<body>
<div id="app">
  <div class="search-bar">
    <div class="city-btn">杭州 <i class="el-icon-arrow-down"></i></div>
    <div class="search-input">
      <el-input size="mini" placeholder="请输入商户名、地点">
        <i slot="prefix" class="el-input__icon el-icon-search"></i>
      </el-input>
    </div>
    <div class="header-icon" @click="toPage(4)"><i class="el-icon-user"></i></div>
  </div>
  <div class="type-list">
    <div class="type-box" v-for="t in types" :key="t.id" @click="toShopList(t.id, t.name)">
      <div class="type-view"><img :src="'/imgs/' + t.icon" alt=""></div>
      <div class="type-text">{{t.name}}</div>
    </div>
  </div>
  <div class="blog-list" @scroll="onScroll">
    <div class="blog-box" v-for="b in blogs" :key="b.id">
      <div class="blog-img" @click="toBlogDetail(b)"><img :src="b.img" alt=""></div>
      <div class="blog-title">{{b.title}}</div>
      <div class="blog-foot">
        <div class="blog-user-icon"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt=""></div>
        <div class="blog-user-name">{{b.name}}</div>
        <div class="blog-liked" @click="addLike(b)">
          <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="14" height="14">
            <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="b.isLike ? '#ff6633' : '#82848a'"></path>
          </svg>
          {{b.liked}}
        </div>
      </div>
    </div>
  </div>
  <button class="ai-guide-trigger" type="button" @click="openAiGuide" aria-label="打开 AI 向导">AI 向导</button>
  <div v-show="aiOpen" class="ai-guide-overlay" @click.self="aiOpen = false">
    <section class="ai-guide-panel" role="dialog" aria-modal="true" aria-label="AI 向导">
      <div class="ai-guide-header">
        <strong>AI 向导</strong>
        <button ref="aiClose" class="ai-guide-close" type="button" @click="aiOpen = false" aria-label="关闭 AI 向导">×</button>
      </div>
      <div class="ai-guide-messages" aria-live="polite" :aria-busy="aiLoading">
        <p v-if="!aiMessages.length" class="ai-guide-empty">想去哪里逛？我可以帮你找灵感。</p>
        <div v-for="(message, index) in aiMessages" :key="index" class="ai-guide-message" :class="'ai-guide-message-' + message.role">
          {{message.content || (aiLoading && message.role === 'assistant' ? '正在思考…' : '')}}
        </div>
      </div>
      <form class="ai-guide-composer" @submit.prevent="sendAiQuestion">
        <label class="ai-guide-label" for="ai-question">向 AI 提问</label>
        <textarea id="ai-question" v-model="aiQuestion" :disabled="aiLoading" placeholder="例如：周末适合和朋友去哪里？"></textarea>
        <button type="submit" :disabled="aiLoading || !aiQuestion.trim()">{{aiLoading ? '生成中…' : '发送'}}</button>
      </form>
    </section>
  </div>
  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      isReachBottom: false,
      types: [], // 类型列表
      blogs: [], // 播客列表
      current: 1,// blog的页码
      aiOpen: false,
      aiQuestion: "",
      aiMessages: [],
      aiLoading: false,
      aiConversationId: "",
    },
    created() {
      this.aiConversationId = sessionStorage.getItem("city-roam-ai-conversation") || this.createConversationId();
      sessionStorage.setItem("city-roam-ai-conversation", this.aiConversationId);
      // 查询类型
      this.queryTypes();
      this.queryHotBlogsScroll();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryHotBlogsScroll() {
        axios.get("/blog/hot?current=" + this.current)
          .then(({data}) => {
            data.forEach(b => b.img = b.images.split(",")[0]);
            this.blogs = this.blogs.concat(data);
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      addLike(b) {
        axios.put("/blog/like/" +b.id)
          .then(({data}) => {
            this.queryBlogById(b)
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error
            b.liked ++;
          })
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop + offsetHeight > scrollHeight && !this.isReachBottom) {
          this.isReachBottom = true

          // 再次查询下一页数据
          this.current++;
          this.queryHotBlogsScroll();
        } else {
          this.isReachBottom = false
        }
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + name
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id
      },
      openAiGuide() {
        this.aiOpen = true;
        this.$nextTick(() => this.$refs.aiClose.focus());
      },
      createConversationId() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, character => {
          const random = Math.floor(Math.random() * 16);
          return (character === "x" ? random : (random & 0x3) | 0x8).toString(16);
        });
      },
      async getAiLocation() {
        if (!navigator.geolocation) return {};
        return new Promise(resolve => navigator.geolocation.getCurrentPosition(
          position => resolve({longitude: position.coords.longitude, latitude: position.coords.latitude}),
          () => resolve({}),
          {enableHighAccuracy: false, timeout: 3000, maximumAge: 60000}
        ));
      },
      async sendAiQuestion() {
        const question = this.aiQuestion.trim();
        if (!question || this.aiLoading) {
          return;
        }
        const answer = {role: "assistant", content: ""};
        this.aiMessages.push({role: "user", content: question}, answer);
        this.aiQuestion = "";
        this.aiLoading = true;
        let completed = false;
        let failed = false;
        try {
          const location = await this.getAiLocation();
          const response = await fetch("/api/ai/chat/stream", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              authorization: sessionStorage.getItem("token") || ""
            },
            body: JSON.stringify({conversationId: this.aiConversationId, message: question, ...location})
          });
          if (!response.ok || !response.body) {
            throw new Error("AI 服务暂不可用，请稍后再试");
          }
          await this.readAiStream(response, (event, data) => {
            if (event === "token") {
              answer.content += data;
            } else if (event === "done") {
              completed = true;
            } else if (event === "error") {
              answer.content = data || "AI 服务暂不可用，请稍后再试";
              failed = true;
            }
          });
          if (!completed && !failed) {
            throw new Error("AI 服务暂不可用，请稍后再试");
          }
        } catch (error) {
          answer.content = "AI 服务暂不可用，请稍后再试";
        } finally {
          this.aiLoading = false;
        }
      },
      async readAiStream(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const chunk = await reader.read();
          buffer += decoder.decode(chunk.value || new Uint8Array(), {stream: !chunk.done});
          const blocks = buffer.split(/\r?\n\r?\n/);
          buffer = blocks.pop();
          blocks.forEach(block => this.handleAiEvent(block, onEvent));
          if (chunk.done) {
            break;
          }
        }
        if (buffer.trim()) {
          this.handleAiEvent(buffer, onEvent);
        }
      },
      handleAiEvent(block, onEvent) {
        const event = (block.match(/^event:\s*(.+)$/m) || [])[1];
        const data = block.split(/\r?\n/).filter(line => line.indexOf("data:") === 0)
          .map(line => line.slice(5).replace(/^ /, "")).join("\n");
        if (event) {
          onEvent(event.trim(), data);
        }
      }
    }
  })
</script>
</body>
</html>
